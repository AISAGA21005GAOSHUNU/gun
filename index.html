<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>圖片識字：槍的中文（兩人對戰｜無提示｜手動回合）</title>

<style>
  :root{
    --card: rgba(255,255,255,.86);
    --shadow: 0 18px 50px rgba(0,0,0,.28);
    --radius: 22px;

    --p1:#2563eb;
    --p2:#ef4444;
    --good: rgba(34,197,94,.18);
    --bad: rgba(239,68,68,.16);
  }

  body{
    margin:0;
    font-family: system-ui, -apple-system, "Noto Sans TC","PingFang TC", Arial, sans-serif;
    color: #0b1220;
    background:
      radial-gradient(1200px 600px at 15% 20%, rgba(34,197,94,.25), transparent 60%),
      radial-gradient(900px 500px at 90% 15%, rgba(250,204,21,.22), transparent 58%),
      radial-gradient(1000px 600px at 70% 85%, rgba(14,165,233,.18), transparent 60%),
      radial-gradient(140px 110px at 12% 36%, rgba(20,83,45,.55), transparent 70%),
      radial-gradient(190px 140px at 23% 66%, rgba(30,64,175,.18), transparent 70%),
      radial-gradient(210px 160px at 38% 45%, rgba(124,45,18,.24), transparent 70%),
      radial-gradient(160px 120px at 58% 28%, rgba(20,83,45,.45), transparent 70%),
      radial-gradient(220px 170px at 72% 56%, rgba(63,98,18,.40), transparent 70%),
      radial-gradient(200px 150px at 88% 44%, rgba(120,53,15,.28), transparent 70%),
      linear-gradient(135deg, #0b1a12, #0b1220);
    min-height:100vh;
  }

  header{
    position:sticky; top:0; z-index:30;
    backdrop-filter: blur(10px);
    background: linear-gradient(180deg, rgba(0,0,0,.58), rgba(0,0,0,.25));
    border-bottom: 1px solid rgba(255,255,255,.10);
  }

  .wrap{max-width:1220px; margin:0 auto; padding:14px 18px;}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}

  .title{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; color:#e5e7eb;}
  h1{margin:0; font-size:22px; letter-spacing:.3px;}
  .sub{font-size:14px; color: rgba(226,232,240,.86)}

  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:999px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.16);
    color:#e5e7eb; font-size:14px;
  }

  select{
    font-size:14px;
    padding:9px 10px;
    border-radius:12px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.25);
    color:#f8fafc;
    outline:none;
  }

  .btn{
    font-size:16px;
    padding:10px 14px;
    border-radius:14px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.12);
    color:#f8fafc;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    user-select:none;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 12px 26px rgba(0,0,0,.25); background: rgba(255,255,255,.18);}
  .btn:active{ transform: translateY(0px) scale(.99); }

  main .grid{
    max-width:1220px;
    margin:16px auto 26px;
    padding:0 18px;
    display:grid;
    grid-template-columns: 1.2fr .8fr;
    gap:18px;
  }
  @media (max-width:980px){ main .grid{ grid-template-columns: 1fr; } }

  .card{
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: var(--shadow);
    padding:18px;
  }

  .media{
    height:460px;
    border-radius:18px;
    border: 1px dashed rgba(0,0,0,.18);
    background: rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .media img{
    width:100%; height:100%;
    object-fit:contain;
    padding:14px;
  }

  .turn{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:10px;
  }
  .tag{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:999px;
    border: 1px solid rgba(2,6,23,.10);
    background: rgba(255,255,255,.88);
    font-size:14px;
    user-select:none;
  }
  .tag .dot{ width:10px; height:10px; border-radius:999px; background:#94a3b8; }
  .tag.p1 .dot{ background: var(--p1); }
  .tag.p2 .dot{ background: var(--p2); }
  .tag.active{
    outline: 3px solid rgba(250,204,21,.35);
    box-shadow: 0 10px 22px rgba(0,0,0,.12);
    transform: translateY(-1px);
  }

  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:999px;
    background: rgba(15,23,42,.06);
    border: 1px solid rgba(15,23,42,.10);
    font-size:14px;
  }
  .pill strong{font-size:16px;}

  .barWrap{
    width:100%; height:12px;
    border-radius:999px;
    background: rgba(2,6,23,.08);
    border: 1px solid rgba(2,6,23,.08);
    overflow:hidden;
    margin:10px 0 14px;
  }
  .bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background: linear-gradient(90deg, rgba(34,197,94,.95), rgba(250,204,21,.95));
    transition: width .25s ease;
  }

  .promptRow{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .neutral{
    font-size:14px;
    color: rgba(15,23,42,.75);
    padding:10px 12px;
    border-radius:14px;
    background: rgba(2,6,23,.04);
    border: 1px solid rgba(2,6,23,.08);
  }
  .iconBtn{
    font-size:16px;
    padding:10px 12px;
    border-radius:14px;
    border: 1px solid rgba(2,6,23,.12);
    background: rgba(255,255,255,.92);
    cursor:pointer;
  }

  .choices{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin-top:12px;
  }
  .choice{
    width:100%;
    font-size:22px;
    font-weight:900;
    padding:16px 16px;
    border-radius:18px;
    border: 1px solid rgba(2,6,23,.14);
    background: rgba(255,255,255,.92);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:14px;
  }
  .choice:hover{ transform: translateY(-1px); box-shadow: 0 12px 22px rgba(0,0,0,.14); background:#fff; }
  .choice:active{ transform: translateY(0px) scale(.99); }

  .num{
    min-width:44px;
    height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    border: 1px solid rgba(2,6,23,.12);
    background: rgba(2,6,23,.04);
    font-size:18px;
    font-weight:900;
  }
  .txt{ font-size:22px; font-weight:900; }

  .choice.wrong{
    border-color: rgba(239,68,68,.35);
    background: rgba(239,68,68,.08);
    animation: shake .22s ease-in-out 0s 2;
  }
  @keyframes shake{
    0%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    50%{ transform: translateX(6px); }
    75%{ transform: translateX(-4px); }
    100%{ transform: translateX(0); }
  }

  .msg{
    margin-top:14px;
    padding:14px 14px;
    border-radius:16px;
    border: 1px solid rgba(2,6,23,.10);
    background: rgba(255,255,255,.85);
    min-height:64px;
    font-size:16px;
    line-height:1.5;
  }
  .msg.ok{ background: rgba(34,197,94,.18); border-color: rgba(34,197,94,.26); }
  .msg.bad{ background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.20); }

  .scoreBoard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  .sb{
    border-radius:18px;
    padding:12px 12px;
    border: 1px solid rgba(2,6,23,.10);
    background: rgba(255,255,255,.88);
  }
  .sb .name{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-weight:900; font-size:16px;
  }
  .sb .meta{
    margin-top:8px;
    display:flex; gap:10px; flex-wrap:wrap;
    font-size:13px;
    color: rgba(15,23,42,.75);
  }
  .badgeMini{
    padding:6px 10px;
    border-radius:999px;
    background: rgba(2,6,23,.04);
    border: 1px solid rgba(2,6,23,.06);
  }

  .gunScore{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    line-height:1;
    font-size:18px;
  }
  .gun{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
  }
  .emptyHint{
    color: rgba(15,23,42,.45);
    font-weight:700;
    font-size:12px;
  }

  canvas#confetti{
    position:fixed; inset:0; pointer-events:none; z-index:999;
  }

  .tiny{
    margin-top:10px;
    font-size:12px;
    color: rgba(15,23,42,.70);
    line-height:1.45;
  }

  .rowBtns{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-top:10px;
  }
  .btnPrimary{
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.25);
  }
</style>
</head>

<body>
<canvas id="confetti"></canvas>

<header>
  <div class="wrap top">
    <div class="title">
      <h1>圖片識字：槍的中文（兩人對戰）</h1>
      <div class="sub">無提示｜不顯示答案｜回合手動按</div>
    </div>

    <div class="controls">
      <label class="chip"><input id="ttsOn" type="checkbox" checked /> 中文朗讀</label>
      <label class="chip">語音：
        <select id="voiceSel" title="選擇中文聲音"></select>
      </label>
      <label class="chip">語速：
        <select id="rateSel" title="語速">
          <option value="0.78">更慢</option>
          <option value="0.85" selected>慢</option>
          <option value="0.92">正常</option>
        </select>
      </label>

      <button id="resetBtn" class="btn" title="重置比分與等級">重置比賽</button>
    </div>
  </div>
</header>

<main>
  <div class="grid">
    <section class="card">
      <div class="media" id="media"></div>
      <div class="tiny">說明：本模式無提示，且不會顯示答案字。請先按「老師回合」或「學生回合」出題。可按鍵盤 1–5 作答。</div>
    </section>

    <section class="card" id="panel">
      <div class="turn">
        <div class="tag p1" id="tagP1"><span class="dot"></span>老師 回合</div>
        <div class="tag p2" id="tagP2"><span class="dot"></span>學生 回合</div>
        <div class="pill">題數：<strong id="count">0</strong></div>
        <div class="pill">等級：<strong id="level">1</strong></div>
      </div>

      <div class="barWrap" aria-label="升級進度">
        <div class="bar" id="bar"></div>
      </div>

      <div class="promptRow">
        <div class="neutral">請看圖片，選擇正確的中文詞。</div>
        <button class="iconBtn" id="speakBtn" title="重播朗讀（不顯示文字）">🔊 重播</button>
      </div>

      <div class="rowBtns">
        <button id="p1Btn" class="btn btnPrimary">老師回合</button>
        <button id="p2Btn" class="btn btnPrimary">學生回合</button>
        <button id="clearBtn" class="btn" title="清空當前題">清空當前題</button>
      </div>

      <div class="choices" id="choices"></div>

      <div class="msg" id="msg">先按「老師回合」或「學生回合」。</div>

      <div class="scoreBoard">
        <div class="sb">
          <div class="name">
            <span>老師</span>
            <span style="color:#2563eb;font-weight:900;">P1</span>
          </div>
          <div class="meta">
            <span class="badgeMini">
              分數：
              <span class="gunScore" id="p1ScoreGuns" title="0">
                <span class="emptyHint">（暫無）</span>
              </span>
            </span>
            <span class="badgeMini">連對：<strong id="p1Streak">0</strong></span>
          </div>
        </div>

        <div class="sb">
          <div class="name">
            <span>學生</span>
            <span style="color:#ef4444;font-weight:900;">P2</span>
          </div>
          <div class="meta">
            <span class="badgeMini">
              分數：
              <span class="gunScore" id="p2ScoreGuns" title="0">
                <span class="emptyHint">（暫無）</span>
              </span>
            </span>
            <span class="badgeMini">連對：<strong id="p2Streak">0</strong></span>
          </div>
        </div>
      </div>

      <div class="tiny">規則：無提示、無題面文字顯示。每次由你選擇「老師回合/學生回合」出新題；答對加分並升級（等級越高選項越多）。</div>
    </section>
  </div>
</main>

<script>
/* ====== 圖片來源：GitHub raw ====== */
const RAW_BASE = "https://raw.githubusercontent.com/AISAGA21005GAOSHUNU/gun/main/assets/";

/* ====== 題庫 ======
   包含原有的槍械 + 你最新要求的三種 (Smoke Grenade, Molotov, Exogun)
*/
const bank = [
  // 原本六種
  { zh:"手槍",  file:"shouqiang.png" },
  { zh:"步槍",  file:"buqiang.png" },
  { zh:"霰彈槍",file:"xiandanqiang.png" },
  { zh:"衝鋒槍",file:"chongfengqiang.png" },
  { zh:"狙擊槍",file:"jujiqiang.png" },
  { zh:"機槍",  file:"jiqiang.png" },

  // 你現有新增
  { zh:"榴彈發射器",    file:"liudanfasheqi.png" },
  { zh:"反器材步槍",    file:"fanqicaibuchiang.png" },
  { zh:"加特林機槍",    file:"jiatelinjiqiang.png" },
  { zh:"突擊步槍", file:"ak47.png" },
  { zh:"卡賓槍",        file:"kabinqiang.png" },
  { zh:"左輪手槍",      file:"zuolunshouqiang.png" },

  // 之前新增的五種
  { zh:"扭曲槍",        file:"niuquqiang.png" },
  { zh:"變形槍",        file:"bianxingqiang.png" },
  { zh:"永凍槍",        file:"yongdongqiang.png" },
  { zh:"競敵重槌",      file:"jingdizhongchui.png" },
  { zh:"權杖",          file:"quanzhang.png" },

  // ★★★ 本次新增的三種 ★★★
  { zh:"煙霧彈",        file:"smokegrenade.png" }, // smoke grenade
  { zh:"汽油彈",        file:"molotov.png" },      // molotov
  { zh:"異能槍",        file:"exogun.png" },       // exogun

].map(x => ({...x, img: RAW_BASE + x.file}));


/* ====== 玩家 ====== */
const P = [
  { name:"老師", score:0, streak:0 },
  { name:"學生", score:0, streak:0 },
];

/* ====== 狀態 ====== */
let count = 0;
let level = 1;
let xp = 0;

let current = null;
let currentTurn = null;  // 0/1；null 表示還未選回合
let optionIndexToText = [];
let answered = false;

/* ====== DOM ====== */
const media = document.getElementById("media");
const choicesBox = document.getElementById("choices");
const msg = document.getElementById("msg");
const countEl = document.getElementById("count");
const levelEl = document.getElementById("level");
const bar = document.getElementById("bar");

const tagP1 = document.getElementById("tagP1");
const tagP2 = document.getElementById("tagP2");

const p1ScoreGuns = document.getElementById("p1ScoreGuns");
const p2ScoreGuns = document.getElementById("p2ScoreGuns");
const p1StreakEl = document.getElementById("p1Streak");
const p2StreakEl = document.getElementById("p2Streak");

document.getElementById("p1Btn").addEventListener("click", () => startTurn(0));
document.getElementById("p2Btn").addEventListener("click", () => startTurn(1));
document.getElementById("clearBtn").addEventListener("click", clearCurrent);
document.getElementById("resetBtn").addEventListener("click", resetGame);
document.getElementById("speakBtn").addEventListener("click", () => speak(current?.zh || ""));

/* ====== 鍵盤 1-5 作答 ====== */
document.addEventListener("keydown", (e) => {
  if(!current || answered) return;
  const k = e.key;
  if(k >= "1" && k <= "5"){
    const idx = Number(k) - 1;
    if(idx >= 0 && idx < optionIndexToText.length){
      const text = optionIndexToText[idx];
      const btn = document.querySelector(`[data-idx="${idx}"]`);
      if(btn) choose(text, btn);
    }
  }
});

/* ====== TTS ====== */
const ttsOn = document.getElementById("ttsOn");
const voiceSel = document.getElementById("voiceSel");
const rateSel = document.getElementById("rateSel");

function loadVoices(){
  const all = speechSynthesis.getVoices();
  const zh = all.filter(v => /zh|cmn/i.test(v.lang) || /Chinese/i.test(v.name));
  const list = zh.length ? zh : all;
  voiceSel.innerHTML = "";
  list.forEach((v, idx) => {
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSel.appendChild(opt);
  });
  if(zh.length){
    const defaultIndex = list.indexOf(zh[0]);
    voiceSel.value = String(defaultIndex);
  }else{
    voiceSel.value = "0";
  }
}
if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  if(!ttsOn.checked) return;
  if(!("speechSynthesis" in window)) return;
  if(!text) return;

  const all = speechSynthesis.getVoices();
  const idx = Number(voiceSel.value || 0);
  const v = all[idx] || all.find(x => /zh|cmn/i.test(x.lang)) || null;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW";
  if(v) u.voice = v;
  u.rate = Number(rateSel.value || 0.85);
  u.pitch = 1.0;
  u.volume = 1.0;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ====== 輕音效 ====== */
let audioCtx = null;
function beep(freq, dur=0.08){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.value = 0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); }, dur*1000);
  }catch(e){}
}

/* ====== 彩帶 ====== */
const cvs = document.getElementById("confetti");
const ctx = cvs.getContext("2d");
let conf = [];
function resize(){ cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", resize); resize();

function shootConfetti(){
  const n = 80;
  for(let i=0;i<n;i++){
    conf.push({
      x: innerWidth*0.62 + (Math.random()-0.5)*160,
      y: innerHeight*0.22,
      vx: (Math.random()-0.5)*10,
      vy: Math.random()*-9 - 6,
      g: 0.22 + Math.random()*0.08,
      r: 3 + Math.random()*4,
      a: 1
    });
  }
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  conf = conf.filter(p => p.a > 0);
  for(const p of conf){
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.a -= 0.012;
    ctx.globalAlpha = Math.max(p.a,0);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,1)";
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
tick();

/* ====== 難度（無提示版：只增選項數） ====== */
function choiceCount(){
  if(level <= 1) return 3;
  if(level === 2) return 4;
  return 5;
}
function setProgress(){
  const need = 5;
  const pct = Math.min(100, (xp / need) * 100);
  bar.style.width = pct + "%";
}
function levelUpIfNeeded(){
  const need = 5;
  if(xp >= need){
    xp = 0;
    level += 1;
    levelEl.textContent = String(level);
    msg.textContent = `升級！等級 ${level}：選項更多，更有挑戰。`;
    msg.className = "msg ok";
    shootConfetti();
    beep(880, 0.10); beep(990, 0.10);
  }
  setProgress();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function refreshTurnUI(){
  tagP1.classList.toggle("active", currentTurn === 0);
  tagP2.classList.toggle("active", currentTurn === 1);
}

/* 分數渲染為手槍圖示 */
function renderGunScore(el, score){
  el.innerHTML = "";
  el.title = String(score);
  if(score <= 0){
    const hint = document.createElement("span");
    hint.className = "emptyHint";
    hint.textContent = "（暫無）";
    el.appendChild(hint);
    return;
  }
  const MAX = 20;
  const show = Math.min(score, MAX);
  for(let i=0;i<show;i++){
    const s = document.createElement("span");
    s.className = "gun";
    s.textContent = "🔫";
    el.appendChild(s);
  }
  if(score > MAX){
    const more = document.createElement("span");
    more.className = "emptyHint";
    more.textContent = `×${score}`;
    el.appendChild(more);
  }
}

function refreshScoreUI(){
  renderGunScore(p1ScoreGuns, P[0].score);
  renderGunScore(p2ScoreGuns, P[1].score);
  p1StreakEl.textContent = String(P[0].streak);
  p2StreakEl.textContent = String(P[1].streak);
}

/* ====== 渲染圖片 ====== */
function renderMedia(item){
  media.innerHTML = "";
  const img = new Image();
  img.alt = "識字圖片";
  img.src = item.img;
  img.onload = () => media.appendChild(img);
  img.onerror = () => { media.textContent = "圖片加載失敗（請檢查 assets 文件名/路徑）"; };
}

/* ====== 手動回合：按按鈕才出題 ====== */
function startTurn(turn){
  currentTurn = turn;
  refreshTurnUI();
  newQuestion(true);
}

function newQuestion(autoSpeak=false){
  current = bank[Math.floor(Math.random()*bank.length)];
  answered = false;

  count += 1;
  countEl.textContent = String(count);

  renderMedia(current);

  const k = choiceCount();
  const others = shuffle(bank.filter(x => x.zh !== current.zh)).slice(0, Math.max(0, k-1)).map(x => x.zh);
  const opts = shuffle([current.zh, ...others]);

  optionIndexToText = opts.slice();

  choicesBox.innerHTML = "";
  opts.forEach((opt, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.dataset.idx = String(idx);

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(idx + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = opt;

    b.appendChild(num);
    b.appendChild(txt);

    b.addEventListener("click", () => choose(opt, b));
    choicesBox.appendChild(b);
  });

  msg.textContent = `輪到 ${P[currentTurn].name}：請選擇正確的中文詞。（按 1-${opts.length}）`;
  msg.className = "msg";

  if(autoSpeak) speak(current.zh);
}

/* ====== 作答：答對後不自動出新題 ====== */
function choose(opt, btn){
  if(!current || answered) return;

  if(opt === current.zh){
    answered = true;

    P[currentTurn].score += 1;
    P[currentTurn].streak += 1;
    P[1-currentTurn].streak = 0;

    xp += 1;

    msg.textContent = `答對了！要出新題請按「老師回合」或「學生回合」。`;
    msg.className = "msg ok";

    beep(660, 0.08);
    if(P[currentTurn].streak >= 2) shootConfetti();
    speak("答對了");

    levelUpIfNeeded();
    refreshScoreUI();
  }else{
    P[currentTurn].streak = 0;
    refreshScoreUI();
    btn.classList.add("wrong");
    msg.textContent = `不對。再試一次。（無提示）`;
    msg.className = "msg bad";
    beep(220, 0.10);
    speak("再試一次");
    setTimeout(()=>btn.classList.remove("wrong"), 520);
  }
}

function clearCurrent(){
  current = null;
  answered = false;
  optionIndexToText = [];
  choicesBox.innerHTML = "";
  media.innerHTML = "";
  msg.textContent = "已清空。請按「老師回合」或「學生回合」。";
  msg.className = "msg";
}

function resetGame(){
  count = 0; level = 1; xp = 0;
  current = null; currentTurn = null; answered = false;
  optionIndexToText = [];
  P[0].score = 0; P[0].streak = 0;
  P[1].score = 0; P[1].streak = 0;

  countEl.textContent = "0";
  levelEl.textContent = "1";
  choicesBox.innerHTML = "";
  media.innerHTML = "";
  msg.textContent = "重置完成。請按「老師回合」或「學生回合」。";
  msg.className = "msg";

  setProgress();
  refreshScoreUI();
  refreshTurnUI();
}

/* init */
levelEl.textContent = String(level);
setProgress();
refreshScoreUI();
clearCurrent();
</script>

</body>
</html>
